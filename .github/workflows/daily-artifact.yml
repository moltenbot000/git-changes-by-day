name: daily-artifact

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: mkdir -p artifacts/${{ github.run_id }}
      - run: go run . -repo . -summary-out artifacts/${{ github.run_id }}/daily-summary.csv -text-out artifacts/${{ github.run_id }}/commit-text.csv
      - uses: actions/upload-artifact@v4
        with:
          name: git-changes-${{ github.run_id }}
          path: artifacts/${{ github.run_id }}
